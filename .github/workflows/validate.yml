name: Validate repository baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate required documentation
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md GOVERNANCE.md CONTRIBUTING.md SECURITY.md docs/service-catalogue.md docs/privacy-and-operations.md docs/knowledge-base-index.md docs/locs-operating-knowledge.md docs/digital-service-playbook.md; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          grep -q "ONLY NAKEBUSEN TRANSACTS" README.md || { echo "README missing the canonical transaction boundary"; exit 1; }
          for amount in "**KES 700**" "**KES 1,500**" "**KES 3,500**"; do
            grep -Fq "$amount" docs/service-catalogue.md || { echo "Catalogue missing approved fixed price: $amount"; exit 1; }
          done
          if grep -Eq "KES (700|1,500|3,500)\\+" docs/service-catalogue.md; then
            echo "Approved public prices are fixed amounts; plus signs are prohibited."
            exit 1
          fi
          grep -q "Retouch & Styling" docs/service-catalogue.md
          grep -q "Sisterlocs Retie" docs/service-catalogue.md
          grep -q "Artificial Locs Installation" docs/service-catalogue.md
          if grep -Fq "KES 3,500+" docs/service-catalogue.md; then
            echo "Artificial Locs Installation must not carry a plus sign."
            exit 1
          fi
          grep -q "3511456" docs/service-catalogue.md || { echo "Catalogue missing the published Buy Goods Till"; exit 1; }
          grep -qi "enquiry is not a booking" README.md
          grep -q "NAKEBUSEN DIGITAL" README.md
          grep -q "Powered by WARENA" README.md
          echo "Required documentation and implicit service-pathway checks passed."

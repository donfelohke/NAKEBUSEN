name: Validate repository baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate required documentation
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md GOVERNANCE.md CONTRIBUTING.md SECURITY.md docs/service-catalogue.md docs/privacy-and-operations.md docs/knowledge-base-index.md docs/locs-operating-knowledge.md docs/digital-service-playbook.md; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          if grep -q "ONLY NAKEBUSEN TRANSACTS" README.md GOVERNANCE.md; then
            echo "Public-facing governance copy must express the service boundary through the approved LOCS/DIGITAL pathways, not the literal slogan."
            exit 1
          fi
          grep -q "Enquiry is not a booking" README.md
          grep -q "NAKEBUSEN DIGITAL" README.md
          grep -q "Powered by WARENA" README.md
          echo "Required documentation and implicit service-pathway checks passed."
